[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "occupancy-ml"
version = "0.1.0"
description = "Clean, time-series-aware occupancy prediction pipeline"
authors = [{name="Meriç Mert Bulca"}]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "joblib>=1.3",
  "fastapi>=0.104",
  "uvicorn[standard]>=0.24",
]

[project.scripts]
occ-ml-train = "occupancy_ml.cli:cli_train"
occ-ml-eval = "occupancy_ml.cli:cli_eval"
