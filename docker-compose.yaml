# Digital Twin Project - Docker Compose Configuration
# 
# Profiles:
# - local-dev: Kafka only (for local development with ML API and Next.js running locally)
# - development: Full development stack in Docker (Kafka + ML API + Next.js)
# - production: Full production stack in Docker (Kafka + ML API + Next.js)
# - testing: Kafka + test utilities
# - full: All services (development + production)
#
# Usage:
# - Local development: docker-compose --profile local-dev up
# - Development: docker-compose --profile development up
# - Production: docker-compose --profile production up
# - Testing: docker-compose --profile testing up
# - All services: docker-compose --profile full up

services:
  # Kafka Broker - Available in all profiles
  broker:
    image: apache/kafka:latest
    container_name: broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - kafka-network
    profiles:
      - local-dev
      - development
      - production
      - testing
      - full

  # Occupancy ML API Service - Production
  occupancy-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: occupancy-ml-api
    ports:
      - "8000:8000"
      - "9090:9090"  # Metrics port
    environment:
      # Model Configuration
      - OCC_MODEL_DIR=/app/artifacts/occ_v2
      - MODEL_VALIDATION_ENABLED=true
      - MODEL_RELOAD_ON_ERROR=false
      
      # Kafka Configuration
      - KAFKA_BOOTSTRAP_SERVERS=broker:9092
      - KAFKA_TOPIC=prod-occupancy-sensor-data
      - KAFKA_GROUP_ID=prod-occupancy-ml-consumer
      - ENABLE_KAFKA=true
      
      # API Configuration
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - LOG_LEVEL=INFO
      
      # Performance Configuration
      - MAX_PREDICTION_BATCH_SIZE=150
      - PREDICTION_TIMEOUT_SECONDS=20
      
      # Docker Settings
      - DEBUG=false
      - ENABLE_CORS=true
      
      # Monitoring
      - ENABLE_METRICS=true
      - METRICS_PORT=9090
      
      # Security
      - ENABLE_RATE_LIMITING=true
      - RATE_LIMIT_PER_MINUTE=500
    depends_on:
      broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - kafka-network
    profiles:
      - production
      - full

  # Development API Service - Docker-based development
  occupancy-api-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: occupancy-ml-api-dev
    ports:
      - "8001:8000"
    environment:
      # Model Configuration
      - OCC_MODEL_DIR=/app/artifacts/occ_v2
      - MODEL_VALIDATION_ENABLED=true
      - MODEL_RELOAD_ON_ERROR=true
      
      # Kafka Configuration
      - KAFKA_BOOTSTRAP_SERVERS=broker:9092
      - KAFKA_TOPIC=dev-occupancy-data
      - KAFKA_GROUP_ID=dev-occupancy-consumer
      
      # API Configuration
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - LOG_LEVEL=DEBUG
      
      # Development Settings
      - DEBUG=true
      - ENABLE_CORS=true
      
      # Performance (relaxed for development)
      - MAX_PREDICTION_BATCH_SIZE=50
      - PREDICTION_TIMEOUT_SECONDS=60
      
      # Monitoring
      - ENABLE_METRICS=true
      - METRICS_PORT=9090
      
      # Security (relaxed for development)
      - ENABLE_RATE_LIMITING=false
    depends_on:
      broker:
        condition: service_healthy
    profiles:
      - development
      - full
    restart: unless-stopped
    networks:
      - kafka-network

  # Kafka Producer (for testing)
  kafka-producer:
    image: confluentinc/cp-kafka:latest
    container_name: kafka-producer
    depends_on:
      broker:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: broker:9092
    command: >
      bash -c "
        echo 'Waiting for Kafka to be ready...' &&
        kafka-topics --bootstrap-server broker:9092 --create --topic docker-occupancy-data --partitions 3 --replication-factor 1 --if-not-exists &&
        kafka-topics --bootstrap-server broker:9092 --create --topic dev-occupancy-data --partitions 3 --replication-factor 1 --if-not-exists &&
        kafka-topics --bootstrap-server broker:9092 --create --topic prod-occupancy-sensor-data --partitions 3 --replication-factor 1 --if-not-exists &&
        echo 'Topics created successfully' &&
        tail -f /dev/null
      "
    profiles:
      - testing
    networks:
      - kafka-network

  # Next.js Digital Twin Client - Production
  digital-twin-client:
    build:
      context: ./digital-twin-client
      dockerfile: Dockerfile
      target: production
      args:
        KAFKA_BROKER_URL: broker:9092
        KAFKA_TOPIC: prod-occupancy-sensor-data
        KAFKA_CLIENT_ID: digital-twin-client-prod
        ENABLE_KAFKA: "true"
    container_name: digital-twin-client
    ports:
      - "3000:3000"
    environment:
      # ML API Configuration
      - ML_API_URL=http://occupancy-api:8000
      - ML_API_WS_URL=ws://occupancy-api:8000
      
      # Kafka Configuration
      - KAFKA_BROKER_URL=broker:9092
      - KAFKA_TOPIC=prod-occupancy-sensor-data
      - KAFKA_CLIENT_ID=digital-twin-client-prod
      
      # Next.js Configuration
      - NEXT_PUBLIC_ML_API_URL=http://localhost:8000
      - NEXT_PUBLIC_ML_API_WS_URL=ws://localhost:8000/ws
      - NEXT_PUBLIC_KAFKA_TOPIC=prod-occupancy-sensor-data
      
      # Production Settings
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - ENABLE_KAFKA=true
    depends_on:
      occupancy-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - kafka-network
    profiles:
      - production
      - full

  # Development Next.js Client - Docker-based development
  digital-twin-client-dev:
    build:
      context: ./digital-twin-client
      dockerfile: Dockerfile
      target: development
    container_name: digital-twin-client-dev
    ports:
      - "3001:3000"
    environment:
      # ML API Configuration
      - ML_API_URL=http://occupancy-api-dev:8000
      - ML_API_WS_URL=ws://occupancy-api-dev:8000
      
      # Kafka Configuration
      - KAFKA_BROKER_URL=broker:9092
      - KAFKA_TOPIC=dev-occupancy-data
      - KAFKA_CLIENT_ID=digital-twin-client-dev
      
      # Next.js Configuration
      - NEXT_PUBLIC_ML_API_URL=http://localhost:8001
      - NEXT_PUBLIC_ML_API_WS_URL=ws://localhost:8001/ws
      - NEXT_PUBLIC_KAFKA_TOPIC=dev-occupancy-data
      
      # Development Settings
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
    depends_on:
      occupancy-api-dev:
        condition: service_healthy
    volumes:
      - ./digital-twin-client:/app:ro
      - nextjs_node_modules:/app/node_modules
      - nextjs_next:/app/.next
    profiles:
      - development
      - full
    restart: unless-stopped
    networks:
      - kafka-network

volumes:
  nextjs_node_modules:
  nextjs_next:

networks:
  kafka-network:
    driver: bridge
