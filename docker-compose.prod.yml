# Docker Compose for Production
# This file is optimized for production deployment
# In production mode: All services (Kafka, ML API, Next.js) run in Docker

services:
  # Production ML API Service
  occupancy-api:
    build:
      target: production
    environment:
      - LOG_LEVEL=INFO
      - DEBUG=false
      - ENABLE_CORS=false
      - MODEL_RELOAD_ON_ERROR=false
      - ENABLE_RATE_LIMITING=true
      - RATE_LIMIT_PER_MINUTE=1000
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Production Next.js Client
  digital-twin-client:
    build:
      target: production
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  # Production Kafka Broker
  broker:
    environment:
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:9092
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
