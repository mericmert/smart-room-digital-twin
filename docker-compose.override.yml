# Docker Compose Override for Development
# This file extends docker-compose.yaml for development purposes
# In development mode: Only Kafka runs in Docker, ML API and Next.js run locally

services:
  # Disable ML API service in development (runs locally)
  occupancy-api:
    profiles:
      - disabled

  # Disable Next.js service in development (runs locally)
  digital-twin-client:
    profiles:
      - disabled

  # Keep only Kafka broker running in Docker for development
  broker:
    environment:
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
